{% extends "main/base.html" %}
{% block title %}{{ action }} Thread{% endblock %}
{% block content %}
  <h2>{{ action }} Thread</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{{ action }}</button>
    <a href="{% url 'forum:thread_list' %}">Cancel</a>
  </form>
{% endblock %}
