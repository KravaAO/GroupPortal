{% extends "main/base.html" %}

{% block title %}{{ voting.title }} - GroupPortal{% endblock %}

{% block content %}
<div style="max-width: 1120px; margin: 2rem auto; padding: 0 1rem;">
    <div style="max-width: 800px; margin: 0 auto;">
        <div style="border: 1px solid var(--border); border-radius: 0.75rem; padding: 2rem; background: var(--card); box-shadow: 0 1px 3px var(--shadow);">
            <h2 style="margin: 0 0 1rem 0; color: #15213b;">{{ voting.title }}</h2>
            <p style="margin: 0 0 1.5rem 0; color: rgba(21, 33, 59, 0.7);">{{ voting.description }}</p>
            <hr style="margin: 1.5rem 0;">
            
            <form method="post">
                {% csrf_token %}
                {% for choice in voting.choices.all %}
                    <div style="margin-bottom: 1.5rem;">
                        <input type="radio" name="choice" id="choice{{ choice.id }}" value="{{ choice.id }}" required style="margin-right: 0.75rem;">
                        <label for="choice{{ choice.id }}" style="font-size: 1.1rem; cursor: pointer;">
                            {{ choice.choice_text }}
                        </label>
                    </div>
                {% endfor %}
                
                <div style="margin-top: 2rem;">
                    <button type="submit" style="width: 100%; background: #15213b; color: white; padding: 1rem; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 1.1rem;">Підтвердити мій голос</button>
                </div>
            </form>
        </div>
        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="{% url 'vote_system:voting_list' %}" style="text-decoration: none; color: #15213b;">← Повернутися до списку</a>
        </div>
    </div>
</div>
{% endblock %}
