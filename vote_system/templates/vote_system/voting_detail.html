{% extends "vote_system/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-primary">{{ voting.title }}</h2>
                    <p class="text-muted">{{ voting.description }}</p>
                    <hr>
                    
                    <form method="post">
                        {% csrf_token %}
                        {% for choice in voting.choices.all %}
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="choice" id="choice{{ choice.id }}" value="{{ choice.id }}" required>
                                <label class="form-check-label fs-5" for="choice{{ choice.id }}">
                                    {{ choice.choice_text }}
                                </label>
                            </div>
                        {% endfor %}
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Підтвердити мій голос</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="mt-3 text-center">
                <a href="{% url 'vote_system:voting_list' %}" class="text-decoration-none">← Повернутися до списку</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
