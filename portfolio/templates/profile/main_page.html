{% extends 'main/base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'profile/main_page.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock %}
{% block content %}

<p class="text-center fs-1 mt-4 mb-4 " style="color: #9bd7df;">Наші аккаунти</p>
<div class="container">
    <div class="row g-4 justify-content-center">

        {% for u in users %}
        <div class="col-lg-3 col-md-4 col-sm-6">
            <a href="{% url 'portfolio' u.username %}" style="text-decoration: none;">
                <div class="card card-hover h-100" style="background-color: rgb(46, 98, 133);">

                    <img src="{{ u.profile.avatar_url }}" class="avatar" alt="avatar">

                    <div class="card-body text-center">
                        <div class="username">{{ u.username }}</div>
                        <div class="bio mt-2">
                            {{ u.profile.bio|default:"Немає опису" }}
                        </div>
                        <p class="email mt-2">
                            <i class="fa-solid fa-envelope"></i> {{ u.email }}
                        </p>

                    </div>


                </div>
            </a>
        </div>
        {% endfor %}

    </div>
</div>
{% endblock %}
